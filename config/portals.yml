# JobOps Portal Configuration
# Configure which job boards to scan and what to search for.

# ─── Search Filters ────────────────────────────────────────────
title_filter:
  positive:
    - Software Engineer
    - Full Stack
    - Backend
    - Frontend
    - SWE
    - Developer
    - Junior
  negative:
    - Senior
    - Staff
    - Intern
    - Lead
    - Manager
    - Director
    - VP

# ─── Company Filters ───────────────────────────────────────────
# Blacklist: skip jobs from these companies
blacklist:
  enabled: true
  companies: []

# Whitelist: ONLY scan jobs from these companies (overrides blacklist if set)
whitelist:
  enabled: false
  companies: []

# ─── Portals ───────────────────────────────────────────────────
portals:
  - name: RemoteOK
    enabled: true
    url: https://remoteok.com/api
    type: api

  - name: Arbeitnow
    enabled: true
    url: https://www.arbeitnow.com/api/job-board-api
    type: api

  - name: Findwork
    enabled: true
    url: https://findwork.dev/api/jobs/
    type: api

  - name: Remotive
    enabled: true
    url: https://remotive.com/api/remote-jobs
    type: api

  - name: freehire
    enabled: true
    url: https://freehire.me/api/v1/jobs
    type: api

  - name: Greenhouse
    enabled: true
    type: greenhouse

  - name: Lever
    enabled: true
    type: lever

  - name: Ashby
    enabled: true
    type: ashby

# ─── Greenhouse Companies ─────────────────────────────────────
