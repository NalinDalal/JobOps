# ─── Instahyre (India-focused portal) ────────────────────────
instahyre:
  enabled: true
  # Instahyre doesn't use slugs - it scans broadly for India jobs
  # Filter by skills/location in the query

# ─── Wellfound (AngelList startups) ──────────────────────────
wellfound:
  enabled: true
  # Wellfound scans broadly - filter by query in profile.yml

# ─── Custom Search Queries ────────────────────────────────────
search_queries:
  - name: "React Developer Remote"
    query: "react developer"
    location: "Remote"
    enabled: true

  - name: "Node.js Backend"
    query: "nodejs backend"
    location: "Remote"
    enabled: true

  - name: "TypeScript Full Stack"
    query: "typescript full stack"
    location: "Remote"
    enabled: true

  - name: "Python Engineer"
    query: "python engineer"
    location: "Remote"
    enabled: true

  # India-specific queries
  - name: "SDE India"
    query: "software development engineer"
    location: "India"
    enabled: true

  - name: "Full Stack India"
    query: "full stack developer"
    location: "India"
    enabled: true

  - name: "Backend India"
    query: "backend developer"
    location: "India"
    enabled: true

  - name: "Junior Developer India"
    query: "junior software engineer"
    location: "India"
    enabled: true

  - name: "Remote India"
    query: "software engineer"
    location: "Remote"
    enabled: true
